<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food | World Culture Explorer</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           FOOD PAGE
        ========================= */

        .food-page {
            padding: 60px 7%;
        }

        .food-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .food-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .food-header p {
            font-size: 18px;
            color: #666;
        }

        .country-name {
            color: #e67e22;
            font-weight: bold;
        }


        /* =========================
           FOOD GRID
        ========================= */

        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }


        /* =========================
           FOOD CARD
        ========================= */

        .food-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            transition: 0.3s;
        }

        .food-card:hover {
            transform: translateY(-6px);
        }

        .food-card h2 {
            margin-top: 0;
            font-size: 26px;
            color: #222;
        }

        .food-card p {
            color: #555;
            line-height: 1.7;
        }


        /* =========================
           MAIN IMAGE
        ========================= */

        .main-food-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            display: block;
            margin-bottom: 15px;
            background: #eee;
        }


        /* =========================
           FOOD GALLERY
        ========================= */

        .food-gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .food-thumbnail {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .food-thumbnail:hover {
            transform: scale(1.04);
            border-color: #e67e22;
        }

        .food-thumbnail.active {
            border-color: #e67e22;
        }


        /* =========================
           FOOD INFO
        ========================= */

        .food-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .food-info strong {
            color: #222;
        }


        /* =========================
           DETAILS BUTTON
        ========================= */

        .food-details-button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }

        .food-details-button:hover {
            background: #e67e22;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 22px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button:hover {
            background: #e67e22;
        }


        /* =========================
           LOADING / ERROR
        ========================= */

        .loading,
        .error-message {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }


        /* =========================
           NO IMAGE
        ========================= */

        .no-image {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            background: linear-gradient(
                135deg,
                #f5f5f5,
                #e8e8e8
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 70px;

            margin-bottom: 15px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .food-grid {
                grid-template-columns: 1fr;
            }

            .food-header h1 {
                font-size: 32px;
            }

            .food-page {
                padding: 40px 5%;
            }

            .main-food-image {
                height: 250px;
            }

        }


        @media (max-width: 500px) {

            .food-gallery {
                gap: 5px;
            }

            .food-thumbnail {
                height: 50px;
            }

            .food-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            🌍 World Culture Explorer
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#countries">
                Countries
            </a>

            <a href="index.html#culture">
                Culture
            </a>

        </nav>

    </header>


    <!-- =========================
         FOOD PAGE
    ========================= -->

    <main class="food-page">


        <!-- HEADER -->

        <div class="food-header">

            <h1>

                🍛 Famous Food of

                <span
                    id="countryName"
                    class="country-name"
                >
                    Loading...
                </span>

            </h1>

            <p>
                Discover traditional food and famous dishes
                from this country.
            </p>

        </div>


        <!-- FOOD CONTAINER -->

        <div
            id="foodContainer"
            class="food-grid"
        >

            <div class="loading">

                🍽️ Loading food...

            </div>

        </div>


        <!-- BACK BUTTON -->

        <a
            href="#"
            id="backButton"
            class="back-button"
        >

            ← Back to Country

        </a>


    </main>

        /* =====================================================
           GET COUNTRY FROM URL
        ===================================================== */

        function getCountryName() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const country =
                params.get("country") ||
                params.get("name") ||
                "India";

            return country.trim();

        }



        /* =====================================================
           FIND COUNTRY CASE-INSENSITIVE
        ===================================================== */

        function findCountry(
            cultureData,
            requestedCountry
        ) {

            const requested =
                requestedCountry
                    .trim()
                    .toLowerCase();

            return Object.keys(cultureData).find(
                key =>
                    key.trim().toLowerCase() === requested
            );

        }

        /* =====================================================
           GET FOOD IMAGES
        ===================================================== */

        function getFoodImages(
            countryKey,
            food
        ) {

            const country =
                countryKey
                    .trim()
                    .toLowerCase();


            if (country === "india") {

                return indiaImages[food] || [];

            }


            if (country === "japan") {

                return japanImages[food] || [];

            }


            if (country === "france") {

                return franceImages[food] || [];

            }


            if (country === "italy") {

                return italyImages[food] || [];

            }


            return [];

        }



        /* =====================================================
           CHANGE MAIN IMAGE
        ===================================================== */

        function changeFoodImage(
            thumbnail,
            mainImageId,
            image
        ) {

            const mainImage =
                document.getElementById(
                    mainImageId
                );


            if (mainImage) {

                mainImage.src = image;

            }


            const gallery =
                thumbnail.parentElement;


            const thumbnails =
                gallery.querySelectorAll(
                    ".food-thumbnail"
                );


            thumbnails.forEach(
                item => {

                    item.classList.remove(
                        "active"
                    );

                }
            );


            thumbnail.classList.add(
                "active"
            );

        }



        /* =====================================================
           LOAD FOOD DATA
        ===================================================== */

        async function loadFoodData() {

            const requestedCountry =
                getCountryName();


            const countryNameElement =
                document.getElementById(
                    "countryName"
                );


            const foodContainer =
                document.getElementById(
                    "foodContainer"
                );


            const backButton =
                document.getElementById(
                    "backButton"
                );


            countryNameElement.textContent =
                requestedCountry;


            backButton.href =
                "country.html?country=" +
                encodeURIComponent(
                    requestedCountry
                );


            try {

                /* =========================
                   LOAD JSON
                ========================= */

                const response =
                    await fetch(
                        "./data/culture.json"
                    );


                if (!response.ok) {

                    throw new Error(
                        "culture.json could not be loaded"
                    );

                }


                const cultureData =
                    await response.json();



                /* =========================
                   FIND COUNTRY
                ========================= */

                const countryKey =
                    findCountry(
                        cultureData,
                        requestedCountry
                    );


                if (!countryKey) {

                    foodContainer.innerHTML = `

                        <div class="error-message">

                            <h2>
                                🌍 Country data not available
                            </h2>

                            <p>

                                Food information for

                                <strong>
                                    ${requestedCountry}
                                </strong>

                                is not available yet.

                            </p>

                            <p>

                                Available countries:

                                ${Object.keys(cultureData).join(", ")}

                            </p>

                        </div>

                    `;

                    return;

                }



                /* =========================
                   GET COUNTRY DATA
                ========================= */

                const countryData =
                    cultureData[countryKey];


                const foods =
                    countryData.food;


                if (
                    !foods ||
                    foods.length === 0
                ) {

                    foodContainer.innerHTML = `

                        <div class="error-message">

                            <h2>
                                🍽️ No food data available
                            </h2>

                        </div>

                    `;

                    return;

                }



                /* =========================
                   CLEAR LOADING
                ========================= */

                foodContainer.innerHTML = "";



                /* =========================
                   CREATE FOOD CARDS
                ========================= */

                foods.forEach(
                    (food, index) => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "food-card";



                        /* =========================
                           GET IMAGES
                        ========================= */

                        const images =
                            getFoodImages(
                                countryKey,
                                food
                            );


                        let imageHTML = "";



                        /* =========================
                           IMAGES AVAILABLE
                        ========================= */

                        if (
                            images &&
                            images.length > 0
                        ) {

                            const mainImageId =
                                "mainFoodImage" +
                                index;


                            imageHTML = `

                                <img

                                    id="${mainImageId}"

                                    src="${images[0]}"

                                    alt="${food}"

                                    class="main-food-image"

                                    onerror="
                                        this.style.display='none';
                                    "

                                >


                                <div class="food-gallery">

                            `;


                            images.forEach(
                                (
                                    image,
                                    imageIndex
                                ) => {

                                    imageHTML += `

                                        <img

                                            src="${image}"

                                            alt="${food} photo ${imageIndex + 1}"

                                            class="food-thumbnail ${
                                                imageIndex === 0
                                                    ? "active"
                                                    : ""
                                            }"

                                            onclick="
                                                changeFoodImage(
                                                    this,
                                                    '${mainImageId}',
                                                    '${image.replace(
                                                        /'/g,
                                                        "\\'"
                                                    )}'
                                                )
                                            "

                                            onerror="
                                                this.style.display='none';
                                            "

                                        >

                                    `;

                                }
                            );


                            imageHTML += `

                                </div>

                            `;

                        }


                        /* =========================
                           NO IMAGE
                        ========================= */

                        else {

                            imageHTML = `

                                <div class="no-image">

                                    🍽️

                                </div>

                            `;

                        }



                        /* =========================
                           DETAILS LINK
                        ========================= */

                        const detailsURL =
                            "food-details.html?country=" +
                            encodeURIComponent(
                                countryKey
                            ) +
                            "&food=" +
                            encodeURIComponent(
                                food
                            );



                        /* =========================
                           CARD HTML
                        ========================= */

                        card.innerHTML = `

                            ${imageHTML}


                            <h2>

                                ${food}

                            </h2>


                            <p>

                                Traditional and popular
                                food from

                                <strong>
                                    ${countryKey}
                                </strong>.

                            </p>


                            <div class="food-info">


                                <p>

                                    <strong>
                                        Country:
                                    </strong>

                                    ${countryKey}

                                </p>


                                <p>

                                    <strong>
                                        Dish:
                                    </strong>

                                    ${food}

                                </p>


                                <p>

                                    <strong>
                                        Photo Source:
                                    </strong>

                                    ${
                                        countryKey
                                            .trim()
                                            .toLowerCase() === "india"
                                            ? "Local Project Images"
                                            : "Wikimedia Commons"
                                    }

                                </p>


                                <a

                                    href="${detailsURL}"

                                    class="food-details-button"

                                >

                                    🍛 View Details →

                                </a>


                            </div>

                        `;


                        foodContainer.appendChild(
                            card
                        );

                    }
                );

            }


            catch (error) {

                console.error(
                    "ERROR:",
                    error
                );


                foodContainer.innerHTML = `

                    <div class="error-message">

                        <h2>
                            ⚠️ Error Loading Food
                        </h2>


                        <p>

                            ${error.message}

                        </p>

                    </div>

                `;

            }

        }



        /* =====================================================
           START
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            loadFoodData
        );


    </script>
