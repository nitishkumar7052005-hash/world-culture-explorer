        }

        .nav-links {

        }

        }

        .main-festival-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

            flex-wrap: wrap;
            margin-bottom: 25px;
        }

            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.3s;
        }

        .gallery-thumb:hover {
            transform: scale(1.05);
            border-color: #ff7a00;
        }

        .gallery-thumb.active {
            border-color: #ff7a00;
        }

            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 30px;
        }

            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: #f0f2f5;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #ff7a00;
            color: white;
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: #ff7a00;
            color: white;
        }

            background: #f7f8fa;
            padding: 14px;
            border-radius: 10px;

            font-size: 16px;
        }

            border-bottom: none;

        }

            font-weight: bold;
        }

        .info-value {
            color: #555;
            text-align: right;

            top: 100px;

            margin-top: 20px;

            height: 130px;

            margin-bottom: 12px;

            border-radius: 10px;
            font-size: 15px;

            color: white;
            border: none;
            padding: 12px 20px;

/* =========================================================
   GET FESTIVAL IMAGES
   ========================================================= */

function getFestivalImages() {

    if (country === "India") {
        return indiaFestivals[festival] || [];
    }

    if (country === "Japan") {
        return japanFestivals[festival] || [];
    }

    if (country === "France") {
        return franceFestivals[festival] || [];
    }

    if (country === "Italy") {
        return italyFestivals[festival] || [];
    }

    return [];

}


/* =========================================================
   LOCAL STORAGE KEYS
   ========================================================= */

const storageKey =
    "wce_festival_" +
    country.toLowerCase().replace(/\s+/g, "_") +
    "_" +
    festival.toLowerCase().replace(/\s+/g, "_");


/* =========================================================
   LIKE
   ========================================================= */

function getLikeKey() {
    return storageKey + "_like";
}


function toggleLike(button) {

    const current =
        localStorage.getItem(getLikeKey()) === "true";

    localStorage.setItem(
        getLikeKey(),
        String(!current)
    );

    updateLikeButton(button);

}


function updateLikeButton(button) {

    const liked =
        localStorage.getItem(getLikeKey()) === "true";

    if (liked) {

        button.textContent = "❤️ Liked";
        button.classList.add("active");

    }
    else {

        button.textContent = "🤍 Like";
        button.classList.remove("active");

    }

}


/* =========================================================
   WISHLIST
   ========================================================= */

function getWishlistKey() {
    return storageKey + "_wishlist";
}


function toggleWishlist(button) {

    const current =
        localStorage.getItem(getWishlistKey()) === "true";

    localStorage.setItem(
        getWishlistKey(),
        String(!current)
    );

    updateWishlistButton(button);

}


function updateWishlistButton(button) {

    const saved =
        localStorage.getItem(getWishlistKey()) === "true";

    if (saved) {

        button.textContent = "🔖 Saved";
        button.classList.add("active");

    }
    else {

        button.textContent = "🔖 Wishlist";
        button.classList.remove("active");

    }

}


/* =========================================================
   USER PHOTOS
   ========================================================= */

function getPhotosKey() {
    return storageKey + "_photos";
}


function getUserPhotos() {

    try {

        return JSON.parse(
            localStorage.getItem(getPhotosKey())
        ) || [];

    }
    catch {

        return [];

    }

}


function saveUserPhoto(file) {

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        const image = new Image();

        image.onload = function() {

            const canvas =
                document.createElement("canvas");

            const maxWidth = 1000;

            let width = image.width;
            let height = image.height;

            if (width > maxWidth) {

                height =
                    height * maxWidth / width;

                width = maxWidth;

            }

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );

            const compressed =
                canvas.toDataURL(
                    "image/jpeg",
                    0.75
                );

            const photos =
                getUserPhotos();

            if (photos.length >= 10) {

                alert(
                    "Maximum 10 photos allowed."
                );

                return;

            }

            photos.push(compressed);

            localStorage.setItem(
                getPhotosKey(),
                JSON.stringify(photos)
            );

            renderUserPhotos();

        };

        image.src = event.target.result;

    };

    reader.readAsDataURL(file);

}


/* =========================================================
   RENDER USER PHOTOS
   ========================================================= */

function renderUserPhotos() {

    const container =
        document.getElementById(
            "userPhotoGrid"
        );

    if (!container) return;

    container.innerHTML = "";

    const photos =
        getUserPhotos();

    photos.forEach(function(photo) {

        const img =
            document.createElement("img");

        img.src = photo;
        img.className = "user-photo";

        container.appendChild(img);

    });

}


/* =========================================================
   REVIEWS
   ========================================================= */

function getReviewsKey() {
    return storageKey + "_reviews";
}


function getReviews() {

    try {

        return JSON.parse(
            localStorage.getItem(getReviewsKey())
        ) || [];

    }
    catch {

        return [];

    }

}


function submitReview() {

    const nameInput =
        document.getElementById("reviewName");

    const textInput =
        document.getElementById("reviewText");

    const name =
        nameInput.value.trim();

    const text =
        textInput.value.trim();

    if (!name || !text) {

        alert(
            "Please enter your name and review."
        );

        return;

    }

    const reviews =
        getReviews();

    reviews.unshift({

        name: name,
        text: text,
        date: new Date().toLocaleDateString()

    });

    localStorage.setItem(
        getReviewsKey(),
        JSON.stringify(reviews)
    );

    nameInput.value = "";
    textInput.value = "";

    renderReviews();

}


function renderReviews() {

    const container =
        document.getElementById(
            "reviewsContainer"
        );

    if (!container) return;

    container.innerHTML = "";

    const reviews =
        getReviews();

    if (reviews.length === 0) {

        container.innerHTML =
            "<p style='color:#777;margin-top:15px;'>No reviews yet. Be the first to share your experience!</p>";

        return;

    }

    reviews.forEach(function(review) {

        const div =
            document.createElement("div");

        div.className = "review";

        div.innerHTML = `

            <div class="review-name">
                👤 ${escapeHTML(review.name)}
            </div>

            <div class="review-text">
                ${escapeHTML(review.text)}
            </div>

            <div class="review-date">
                ${escapeHTML(review.date)}
            </div>

        `;

        container.appendChild(div);

    });

}


/* =========================================================
   SECURITY HELPER
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

        document.getElementById(
            "mainFestivalImage"

        .querySelectorAll(".gallery-thumb")

    thumbnail.classList.add("active");

}
