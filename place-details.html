<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Details | World Culture Explorer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #222;
            line-height: 1.6;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: #111827;
            color: white;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #fbbf24;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        /* =========================
           HERO
        ========================= */

        .hero-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .hero-image {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .hero-content {
            padding: 28px;
        }

        .hero-content h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .location {
            color: #666;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .rating {
            color: #f59e0b;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #eef2ff;
            color: #1e3a8a;
            transition: 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .like-btn.liked {
            background: #fee2e2;
            color: #dc2626;
        }

        .wishlist-btn.saved {
            background: #fef3c7;
            color: #92400e;
        }

        /* =========================
           DETAILS GRID
        ========================= */

        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        .section-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .section-card h2 {
            margin-bottom: 15px;
            font-size: 24px;
        }

        .section-card h3 {
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        /* =========================
           HIGHLIGHTS
        ========================= */

        .highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .highlight {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* =========================
           MAP
        ========================= */

        #placeMap {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
        }

        .map-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        /* =========================
           WEATHER
        ========================= */

        .weather-card {
            background: linear-gradient(
                135deg,
                #eff6ff,
                #dbeafe
            );
            border-radius: 15px;
            padding: 25px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 55px;
        }

        .weather-temperature {
            font-size: 42px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .weather-condition {
            color: #555;
            font-size: 17px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .weather-detail {
            background: white;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }

        .weather-detail strong {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .weather-detail span {
            color: #666;
            font-size: 13px;
        }

        .weather-loading {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .weather-error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 15px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {

            .weather-details {
                grid-template-columns: 1fr;
            }

            .weather-temperature {
                font-size: 34px;
            }

        }
        /* =====================================================
   NEARBY ATTRACTIONS
===================================================== */

.nearby-container {
    margin-top: 10px;
}

.nearby-loading {
    text-align: center;
    padding: 30px 20px;
    color: #666;
    background: #f8fafc;
    border-radius: 12px;
}

.nearby-error {
    padding: 18px;
    background: #fef2f2;
    color: #b91c1c;
    border-radius: 10px;
    line-height: 1.6;
}

.nearby-empty {
    text-align: center;
    padding: 30px 20px;
    color: #666;
    background: #f8fafc;
    border-radius: 12px;
}

.nearby-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.nearby-subtitle {
    color: #666;
    font-size: 14px;
    margin: 0;
}

.nearby-radius {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
}

.nearby-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.nearby-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
    transition: transform 0.2s ease,
                box-shadow 0.2s ease;
}

.nearby-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
}

.nearby-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eff6ff;
    border-radius: 12px;
    font-size: 25px;
    margin-bottom: 12px;
}

.nearby-name {
    font-size: 18px;
    margin: 0 0 7px;
    color: #222;
    line-height: 1.3;
}

.nearby-category {
    display: inline-block;
    background: #f3f4f6;
    color: #4b5563;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 12px;
}

.nearby-distance {
    color: #555;
    font-size: 14px;
    margin: 5px 0;
}

.nearby-address {
    color: #777;
    font-size: 13px;
    line-height: 1.5;
    min-height: 20px;
    margin: 8px 0 14px;
}

.nearby-map-button {
    display: inline-block;
    text-decoration: none;
    background: #2563eb;
    color: white;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 13px;
    transition: background 0.2s ease;
}

.nearby-map-button:hover {
    background: #1d4ed8;
}

.nearby-source {
    margin-top: 18px;
    color: #888;
    font-size: 11px;
    text-align: right;
}

.nearby-map {
    width: 100%;
    height: 350px;
    border-radius: 12px;
    margin-top: 22px;
    overflow: hidden;
}

@media (max-width: 900px) {
    .nearby-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    .nearby-grid {
        grid-template-columns: 1fr;
    }

    .nearby-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .nearby-map {
        height: 280px;
    }
}
        /* =========================
           GALLERY
        ========================= */

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery-item {

        }

            display: block;

            top: 8px;
            right: 8px;
            border: none;
            background: rgba(17, 24, 39, 0.85);

            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        .photo-delete-btn:hover {
            background: #dc2626;
        }

        .gallery-empty {
            color: #777;

        /* =========================
           PHOTO UPLOAD
        ========================= */

        .photo-upload-box {

            border: 1px dashed #cbd5e1;

            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .choose-photo-btn:hover {
            background: #1f2937;
        }

        .upload-status {
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }

        /* =========================
           COMMENTS
        ========================= */

        .comment-form {
            margin-bottom: 25px;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 15px;
        }

        .comment-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .post-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .post-btn:hover {
            background: #1d4ed8;
        }

        .comment {
            border-top: 1px solid #eee;
            padding: 18px 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .comment-user {
            font-weight: bold;
        }

        .comment-date {
            color: #888;
            font-size: 13px;
        }

        .comment-text {
            margin: 8px 0;
            white-space: pre-wrap;
        }

        .comment-actions {
            display: flex;
            gap: 15px;
        }

        .comment-action {
            border: none;
            background: none;
            cursor: pointer;
            color: #555;
            font-size: 14px;
        }

        .comment-action:hover {
            color: #2563eb;
        }

        .reply-box {
            margin-top: 12px;
            padding-left: 20px;
            border-left: 3px solid #e5e7eb;
        }

        .reply-form {
            display: none;
            margin-top: 12px;
        }

        .reply-form textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            resize: vertical;
            font-family: inherit;
        }

        .reply-submit {
            margin-top: 6px;
            background: #111827;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* =========================
           EMPTY / ERROR
        ========================= */

        .message {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            margin-top: 40px;
        }

        .message h2 {
            margin-bottom: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .nav-links {
                display: none;
            }

            .hero-image {
                height: 300px;
            }

            .hero-content h1 {
                font-size: 28px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {

            .container {
                width: 94%;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 220px;
            }

            .hero-content {
                padding: 20px;
            }
        }
    </style>
</head>

     NAVBAR

    </ul>

<!-- =========================
     MAIN

<main class="container">

  

    <div id="placeContainer">

        <div class="message">

            <h2>Loading place...</h2>

            <p>
                Please wait.
            </p>

        </div>

    </div>

</main>


<footer>

    <p>🌍 World Culture Explorer</p>

    <p>
        Explore cultures, places and traditions around the world.
    </p>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentCountry = "";
let currentPlace = "";
let currentData = null;
let placeMap = null;


/* =====================================================
   GET URL PARAMETERS
===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);

currentCountry =
    urlParams.get("country");

currentPlace =
    urlParams.get("place");


/* =====================================================
   LOCAL STORAGE HELPERS
===================================================== */

function getStorageKey(type) {

    return `${type}_${currentCountry}_${currentPlace}`;
}


/* =====================================================
   LOAD PLACE DATA
===================================================== */

async function loadPlace() {

    const container =
        document.getElementById("placeContainer");


    if (!currentCountry || !currentPlace) {

        container.innerHTML = `

            <div class="message">

                <h2>Place not found</h2>

                <p>
                    Country or place name is missing
                    from the URL.
                </p>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch("./data/places.json");


        if (!response.ok) {

            throw new Error(
                "Could not load places.json"
            );

        }


        const data =
            await response.json();


        if (!data[currentCountry]) {

            throw new Error(
                "Country not found"
            );

        }


        if (!data[currentCountry][currentPlace]) {

            throw new Error(
                "Place not found"
            );

        }


        currentData =
            data[currentCountry][currentPlace];


        renderPlace();


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="message">

                <h2>
                    Place not found 😕
                </h2>

                <p>
                    We couldn't find
                    <strong>
                        ${escapeHTML(
                            currentPlace || ""
                        )}
                    </strong>.
                </p>

            </div>

        `;

    }
}


/* =====================================================
   RENDER PLACE
===================================================== */

function renderPlace() {

    const container =
        document.getElementById(
            "placeContainer"
        );


    const image =
        currentData.image ||
        "https://via.placeholder.com/1200x600?text=No+Image";


    const description =
        currentData.description ||
        "No description available.";


    const location =
        currentData.location ||
        `${currentPlace}, ${currentCountry}`;


    const category =
        currentData.category ||
        "Culture";


    const bestTime =
        currentData.bestTime ||
        "Information not available";


    const estimatedCost =
        currentData.estimatedCost ||
        "Information not available";


    const highlights =
        Array.isArray(currentData.highlights)
            ? currentData.highlights
            : [];


    const thingsToDo =
        Array.isArray(currentData.thingsToDo)
            ? currentData.thingsToDo
            : [];


    const rating =
        currentData.rating ||
        "Not rated";


    let highlightsHTML = "";


    if (highlights.length > 0) {

        highlightsHTML =
            highlights
                .map(item => `

                    <span class="highlight">
                        ${escapeHTML(item)}
                    </span>

                `)
                .join("");

    } else {

        highlightsHTML = `

            <span class="highlight">
                No highlights available
            </span>

        `;
    }


    let thingsHTML = "";


    if (thingsToDo.length > 0) {

        thingsHTML = `

            <ul class="info-list">

                ${thingsToDo
                    .map(item => `

                        <li>
                            ✓ ${escapeHTML(item)}
                        </li>

                    `)
                    .join("")}

            </ul>

        `;

    } else {

        thingsHTML = `

            <p>
                Things to do information
                will be added soon.
            </p>

        `;
    }


    container.innerHTML = `

        <!-- HERO -->

        <section class="hero-card">

            <img
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(currentPlace)}"
                class="hero-image"
                onerror="
                    this.src='https://via.placeholder.com/1200x600?text=Image+Not+Available'
                "
            >


            <div class="hero-content">

                <h1>
                    ${escapeHTML(currentPlace)}
                </h1>


                <p class="location">
                    📍 ${escapeHTML(location)}
                </p>


                <div class="rating">
                    ⭐ ${escapeHTML(String(rating))}
                </div>


                <div class="actions">

                    <button
                        id="likeBtn"
                        class="action-btn like-btn"
                        onclick="togglePlaceLike()"
                    >
                        ❤️ Like
                        <span id="likeCount">0</span>
                    </button>


                    <button
                        id="wishlistBtn"
                        class="action-btn wishlist-btn"
                        onclick="toggleWishlist()"
                    >
                        💾 Add to Wishlist
                    </button>

                </div>

            </div>

        </section>


        <!-- DETAILS -->

        <div class="details-grid">

            <div>

                <!-- ABOUT -->

                <section class="section-card">

                    <h2>
                        About
                    </h2>

                    <p>
                        ${escapeHTML(description)}
                    </p>

                </section>


                <!-- THINGS TO DO -->

                <section class="section-card">

                    <h2>
                        Things to Do
                    </h2>

                    ${thingsHTML}

                </section>


                <!-- HIGHLIGHTS -->

                <section class="section-card">

                    <h2>
                        Highlights
                    </h2>

                    <div class="highlights">
                        ${highlightsHTML}
                    </div>

                </section>


                <!-- MAP -->

                <section class="section-card">

                    <h2>
                        🗺️ View on Map
                    </h2>


                    <div id="placeMap"></div>


                    <a
                        id="googleMapLink"
                        class="map-btn"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📍 Open in Google Maps
                    </a>

                </section>
<!-- WEATHER -->

<section class="section-card">

    <h2>
        🌤️ Current Weather
    </h2>

    <div id="weatherContainer">

        <div class="weather-loading">
            Loading weather...
        </div>

    </div>

</section>
<!-- =====================================================
     NEARBY ATTRACTIONS
===================================================== -->

<section class="section-card">

    <h2>📍 Nearby Attractions</h2>

    <div
        id="nearbyAttractionsContainer"
        class="nearby-container"
    >

        <div class="nearby-loading">
            🔎 Finding nearby attractions...
        </div>

    </div>

</section>

                <!-- GALLERY -->

                <section class="section-card">

                    <h2>
                        📸 Gallery
                    </h2>


                    <!-- PHOTO UPLOAD -->

                    <div class="photo-upload-box">

                        <p>
                            Have your own photo of this place?
                            Add it to the gallery.
                        </p>


                        <label
                            for="photoInput"
                            class="choose-photo-btn"
                        >
                            📷 Choose Photos
                        </label>


                        <input
                            type="file"
                            id="photoInput"
                            class="photo-input"
                            accept="image/*"
                            multiple
                            onchange="addPhotos(event)"
                        >


                        <div
                            id="uploadStatus"
                            class="upload-status"
                        ></div>

                    </div>


                    <div
                        id="gallery"
                        class="gallery"
                    ></div>

                </section>


                <!-- COMMENTS / REVIEWS -->

                <section class="section-card">

                    <h2>
                        💬 Reviews & Comments
                    </h2>


                    <form
                        class="comment-form"
                        onsubmit="addComment(event)"
                    >

                        <input
                            type="text"
                            id="commentName"
                            placeholder="Your name"
                            maxlength="50"
                            required
                        >


                        <textarea
                            id="commentText"
                            placeholder="Write your review or comment..."
                            maxlength="500"
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="post-btn"
                        >
                            📝 Post Review
                        </button>

                    </form>


                    <div id="commentsList"></div>

                </section>

            </div>

  <a href="javascript:history.back()" class="back-btn">
        ← Back to Places
    </a>
            <!-- SIDEBAR -->

            <aside>

===================================================== */

function togglePlaceLike() {

    const likedKey =
        getStorageKey("placeLiked");

    const countKey =
        getStorageKey("placeLikeCount");


    const currentlyLiked =
        localStorage.getItem(likedKey) === "true";


    let count =
        Number(
            localStorage.getItem(countKey)
        ) || 0;


    if (currentlyLiked) {

        count =
            Math.max(0, count - 1);


        localStorage.setItem(
            likedKey,
            "false"
        );

    } else {

        count++;


        localStorage.setItem(
            likedKey,
            "true"
        );

    }


    localStorage.setItem(
        countKey,
        count
    );


    updatePlaceLikeUI();
}

/* =====================================================
   GALLERY
===================================================== */

function createGallery() {

    const gallery =
        document.getElementById("gallery");


    if (!gallery) {
        return;
    }


    let images = [];


    /*
       Images coming from places.json
    */

    if (Array.isArray(currentData.gallery)) {

        images =
            currentData.gallery.filter(
                image =>
                    typeof image === "string"
            );

    }


    /*
       Main place image
       will be shown if gallery
       has no JSON images.
    */

    if (
        images.length === 0 &&
        currentData.image
    ) {

        images.push(
            currentData.image
        );
    }


    /*
       Add user uploaded photos.
    */

    const uploadedPhotos =
        getUploadedPhotos();


    uploadedPhotos.forEach(photo => {

        images.push({
            src: photo.src,
            uploaded: true,
            id: photo.id
        });

    });


    if (images.length === 0) {

        gallery.innerHTML = `

            <p class="gallery-empty">
                No photos available yet.
            </p>

        `;

        return;
    }


    gallery.innerHTML =
        images.map(
            (image, index) => {

                let imageSource = "";
                let uploaded = false;
                let photoId = "";


                if (
                    typeof image === "string"
                ) {

                    imageSource =
                        image;

                } else {

                    imageSource =
                        image.src;

                    uploaded =
                        image.uploaded;

                    photoId =
                        image.id;

                }


                const deleteButton =
                    uploaded
                        ? `

                            <button
                                class="photo-delete-btn"
                                onclick="
                                    deleteUploadedPhoto(
                                        '${photoId}'
                                    )
                                "
                                title="Remove photo"
                            >
                                ×
                            </button>

                        `
                        : "";


                return `

                    <div class="gallery-item">

                        <img
                            src="${escapeAttribute(
                                imageSource
                            )}"
                            alt="${escapeAttribute(
                                currentPlace
                            )} image ${index + 1}"
                            onclick="
                                openGalleryImage(
                                    '${escapeAttribute(
                                        imageSource
                                    )}'
                                )
                            "
                            onerror="
                                this.style.display='none'
                            "
                        >

                        ${deleteButton}

                    </div>

                `;

            }
        ).join("");
}

/* =====================================================
   ADD PHOTOS
===================================================== */

async function addPhotos(event) {

    const files =
        Array.from(
            event.target.files || []
        );


    const status =
        document.getElementById(
            "uploadStatus"
        );


    if (files.length === 0) {
        return;
    }


    if (status) {

        status.textContent =
            "Preparing photos...";

    }


    let savedPhotos =
        getUploadedPhotos();


    for (
        let index = 0;
        index < files.length;
        index++
    ) {

        const file =
            files[index];


        if (!file.type.startsWith("image/")) {
            continue;
        }


        try {

            const compressedImage =
                await compressImage(file);


            const newPhoto = {

                id:
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8),

                src:
                    compressedImage,

                date:
                    new Date().toISOString()

            };


            savedPhotos.push(
                newPhoto
            );


            /*
               Keep only latest 10
               uploaded photos.
            */

            if (
                savedPhotos.length > 10
            ) {

                savedPhotos =
                    savedPhotos.slice(-10);

            }


            const saved =
                saveUploadedPhotos(
                    savedPhotos
                );


            if (!saved) {

                alert(
                    "Photo could not be saved. Browser storage may be full."
                );

                break;
            }


        } catch (error) {

            console.error(
                "Photo processing failed:",
                error
            );

        }

    }


    if (status) {

        status.textContent =
            "Photo added to the gallery.";

    }


    event.target.value = "";


    createGallery();

}


/* =====================================================
   COMPRESS IMAGE
===================================================== */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = function(event) {

                const image =
                    new Image();


                image.onload = function() {

                    const maxWidth = 1200;
                    const maxHeight = 900;


                    let width =
                        image.width;

                    let height =
                        image.height;


                    if (
                        width > maxWidth
                    ) {

                        height =
                            height *
                            (maxWidth / width);

                        width =
                            maxWidth;

                    }


                    if (
                        height > maxHeight
                    ) {

                        width =
                            width *
                            (maxHeight / height);

                        height =
                            maxHeight;

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        Math.round(width);

                    canvas.height =
                        Math.round(height);


                    const context =
                        canvas.getContext(
                            "2d"
                        );


                    context.drawImage(
                        image,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    const compressed =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.78
                        );


                    resolve(
                        compressed
                    );

                };


                image.onerror =
                    reject;


                image.src =
                    event.target.result;

            };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );
}


/* =====================================================
   DELETE UPLOADED PHOTO
===================================================== */

function deleteUploadedPhoto(photoId) {

    const photos =
        getUploadedPhotos();


    const updatedPhotos =
        photos.filter(

                photo.id !== photoId

    saveUploadedPhotos(
        updatedPhotos

    createGallery();

}

/* =====================================================
   LOAD NEARBY ATTRACTIONS
===================================================== */

async function loadNearbyAttractions() {

    const container =
        document.getElementById(
            "nearbyAttractionsContainer"
        );

    if (!container) {
        return;
    }

    if (!currentData) {

        container.innerHTML = `
            <div class="nearby-error">
                📍 Nearby attraction information
                is not available.
            </div>
        `;

        return;
    }


    const latitude =
        Number(currentData.latitude);

    const longitude =
        Number(currentData.longitude);


    if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
    ) {

        container.innerHTML = `
            <div class="nearby-error">
                📍 Coordinates are not available
                for this place.
            </div>
        `;

        return;
    }


    container.innerHTML = `
        <div class="nearby-loading">
            🔎 Finding nearby attractions...
        </div>
    `;


    /*
     * Smaller and faster Overpass query.
     */

    const radius = 5000;

    const query = `
[out:json][timeout:20];

(
    nwr(
        around:${radius},
        ${latitude},
        ${longitude}
    )["tourism"~"attraction|museum|gallery|viewpoint"];

    nwr(
        around:${radius},
        ${latitude},
        ${longitude}
    )["historic"];

    nwr(
        around:${radius},
        ${latitude},
        ${longitude}
    )["leisure"~"park|garden|nature_reserve"];

    nwr(
        around:${radius},
        ${latitude},
        ${longitude}
    )["amenity"~"restaurant|cafe"];

    nwr(
        around:${radius},
        ${latitude},
        ${longitude}
    )["shop"="mall"];
);

out center tags;
`;


    /*
     * Multiple Overpass servers.
     */

    const servers = [

        "https://overpass-api.de/api/interpreter",

        "https://overpass.kumi.systems/api/interpreter",

        "https://overpass.private.coffee/api/interpreter"

    ];


    let result = null;
    let lastError = null;


    /*
     * Try servers one by one.
     */

    for (
        let i = 0;
        i < servers.length;
        i++
    ) {

        try {

            console.log(
                "Trying Overpass server:",
                servers[i]
            );


            const response =
                await fetch(
                    servers[i],
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            "data=" +
                            encodeURIComponent(
                                query
                            )
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );
            }


            result =
                await response.json();


            /*
             * Successful response.
             */

            if (
                result &&
                Array.isArray(
                    result.elements
                )
            ) {

                console.log(
                    "Nearby attractions loaded successfully."
                );

                break;
            }


        } catch (error) {

            console.warn(
                "Overpass server failed:",
                servers[i],
                error
            );


            lastError =
                error;
        }
    }


    /*
     * All servers failed.
     */

    if (!result) {

        console.error(
            "All Overpass servers failed:",
            lastError
        );


        container.innerHTML = `
            <div class="nearby-error">

                📍 Nearby attractions are
                temporarily unavailable.

                <br><br>

                Please refresh the page
                and try again.

            </div>
        `;

        return;
    }


    const elements =
        Array.isArray(
            result.elements
        )
            ? result.elements
            : [];


    const attractions =
        processNearbyAttractions(
            elements,
            latitude,
            longitude
        );


    renderNearbyAttractions(
        attractions,
        latitude,
        longitude
    );
}

/* =====================================================
   PROCESS NEARBY ATTRACTIONS
===================================================== */

function processNearbyAttractions(
    elements,
    centerLatitude,
    centerLongitude
) {

    const uniquePlaces =
        new Map();


    elements.forEach(function(element) {

        const tags =
            element.tags || {};


        const name =
            tags.name ||
            tags["name:en"] ||
            "";


        if (!name) {
            return;
        }


        let latitude =
            Number(element.lat);

        let longitude =
            Number(element.lon);


        /*
         * Ways and relations usually return
         * their coordinates inside "center".
         */

        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {

            if (element.center) {

                latitude =
                    Number(
                        element.center.lat
                    );

                longitude =
                    Number(
                        element.center.lon
                    );
            }
        }


        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {
            return;
        }


        /*
         * Ignore the current place itself
         * if OSM happens to return it.
         */

        const distance =
            calculateDistance(
                centerLatitude,
                centerLongitude,
                latitude,
                longitude
            );


        if (distance < 0.05) {
            return;
        }


        const category =
            getNearbyCategory(tags);


        const icon =
            getNearbyIcon(category);


        const address =
            buildNearbyAddress(tags);


        const mapKey =
            name.toLowerCase() +
            "_" +
            latitude.toFixed(5) +
            "_" +
            longitude.toFixed(5);


        if (!uniquePlaces.has(mapKey)) {

            uniquePlaces.set(
                mapKey,
                {
                    name: name,
                    category: category,
                    icon: icon,
                    address: address,
                    latitude: latitude,
                    longitude: longitude,
                    distance: distance
                }
            );
        }

    });


    return Array.from(
        uniquePlaces.values()
    )
    .sort(function(a, b) {

        return (
            a.distance -
            b.distance
        );

    })
    .slice(0, 12);
}


/* =====================================================
   CATEGORY
===================================================== */

function getNearbyCategory(tags) {

    const tourism =
        tags.tourism || "";

    const historic =
        tags.historic || "";

    const leisure =
        tags.leisure || "";

    const amenity =
        tags.amenity || "";

    const shop =
        tags.shop || "";


    if (historic) {
        return "Historical";
    }


    if (tourism === "museum") {
        return "Museum";
    }


    if (tourism === "gallery") {
        return "Art Gallery";
    }


    if (tourism === "viewpoint") {
        return "Viewpoint";
    }


    if (
        tourism === "zoo" ||
        tourism === "aquarium" ||
        tourism === "theme_park"
    ) {
        return "Entertainment";
    }


    if (tourism === "hotel") {
        return "Hotel";
    }


    if (tourism === "attraction") {
        return "Tourist Attraction";
    }


    if (
        leisure === "park" ||
        leisure === "garden"
    ) {
        return "Park & Garden";
    }


    if (leisure === "nature_reserve") {
        return "Nature";
    }


    if (amenity === "restaurant") {
        return "Restaurant";
    }


    if (amenity === "cafe") {
        return "Cafe";
    }


    if (shop === "mall") {
        return "Shopping";
    }


    return "Nearby Place";
}

/* =====================================================
   ADDRESS
===================================================== */

function buildNearbyAddress(tags) {

    const parts = [];


    const road =
        tags["addr:street"];


    const city =
        tags["addr:city"] ||
        tags["addr:town"] ||
        tags["addr:village"];


    const postcode =
        tags["addr:postcode"];


    if (road) {
        parts.push(road);
    }


    if (city) {
        parts.push(city);
    }


    if (postcode) {
        parts.push(postcode);
    }


    return parts.join(", ");
}

/* =====================================================
   DISTANCE CALCULATION
===================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadius = 6371;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            toRadians(lat1)
        ) *

        Math.cos(
            toRadians(lat2)
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return (
        earthRadius *
        c
    );
}
/* =========================
   CALCULATE TRIP COST
========================= */

function calculateTripCost() {

    const days = getNumberOfDays();

    const travelers =
        Number(
            document.getElementById("travelers").value
        ) || 1;

    if (!days) return 0;

    const dailyRate = getBudgetRate();

    return days * travelers * dailyRate;
}


/* =========================
   FORMAT COST
========================= */

function formatCost(amount) {

    const currency =
        getCurrency();

    return new Intl.NumberFormat(
        "en-IN",
        {
            style: "currency",
            currency: currency,
            maximumFractionDigits: 0
        }
    ).format(amount);
}

/* =====================================================
   RADIANS
===================================================== */

function toRadians(degrees) {

    return (
        degrees *
        Math.PI /
        180
    );
}


/* =====================================================
   DISTANCE FORMAT
===================================================== */

function formatDistance(
    distance
) {

    if (distance < 1) {

        return (
            Math.round(
                distance * 1000
            ) +
            " m away"
        );
    }


    return (
        distance.toFixed(1) +
        " km away"
    );
}


/* =====================================================
   GOOGLE MAPS COORDINATE LINK
===================================================== */

function createCoordinateMapLink(
    latitude,
    longitude
) {

    return (
        "https://www.google.com/maps/search/?api=1" +
        "&query=" +
        encodeURIComponent(
            latitude +
            "," +
            longitude
        )
    );
}


/* =====================================================
   NEARBY ATTRACTIONS MAP
===================================================== */

function initializeNearbyAttractionsMap(
    attractions,
    centerLatitude,
    centerLongitude
) {

    const mapElement =
        document.getElementById(
            "nearbyAttractionsMap"
        );


    if (!mapElement) {
        return;
    }


    /*
     * Remove previous map instance
     * if render happens again.
     */

    if (nearbyAttractionsMap) {

        nearbyAttractionsMap.remove();

        nearbyAttractionsMap =
            null;

        nearbyAttractionsMarkers =
            [];
    }


    nearbyAttractionsMap =
        L.map(
            "nearbyAttractionsMap"
        ).setView(
            [
                centerLatitude,
                centerLongitude
            ],
            14
        );


    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution:
                "Tiles &copy; Esri"
        }
    ).addTo(
        nearbyAttractionsMap
    );


    /*
     * Current place marker
     */

    const currentMarker =
        L.marker([
            centerLatitude,
            centerLongitude
        ]).addTo(
            nearbyAttractionsMap
        );


    currentMarker.bindPopup(
        `
            <strong>
                ${escapeHTML(
                    currentPlace
                )}
            </strong>
            <br>
            📍 Current Place
        `
    );


    nearbyAttractionsMarkers.push(
        currentMarker
    );


    /*
     * Nearby markers
     */

    attractions.forEach(
        function(place) {

            const marker =
                L.marker([
                    place.latitude,
                    place.longitude
                ]).addTo(
                    nearbyAttractionsMap
                );


            const mapURL =
                createCoordinateMapLink(
                    place.latitude,
                    place.longitude
                );


            marker.bindPopup(
                `
                    <strong>
                        ${place.icon}
                        ${escapeHTML(
                            place.name
                        )}
                    </strong>

                    <br>

                    <span>
                        ${escapeHTML(
                            place.category
                        )}
                    </span>

                    <br>

                    📏
                    ${formatDistance(
                        place.distance
                    )}

                    <br><br>

                    <a
                        href="${mapURL}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🗺️ Open in Google Maps
                    </a>
                `
            );


            nearbyAttractionsMarkers.push(
                marker
            );

        }
    );


    /*
     * Automatically fit map to
     * current place + attractions.
     */

    const bounds =
        L.latLngBounds([]);


    bounds.extend([
        centerLatitude,
        centerLongitude
    ]);


    attractions.forEach(
        function(place) {

            bounds.extend([
                place.latitude,
                place.longitude
            ]);

        }
    );


    if (bounds.isValid()) {

        nearbyAttractionsMap.fitBounds(
            bounds,
            {
                padding: [
                    30,
                    30
                ]
            }
        );
    }
}
/* =====================================================
   COMMENTS
===================================================== */

function getComments() {

    const key =
        getStorageKey("comments");


    try {

        return JSON.parse(
            localStorage.getItem(key)
        ) || [];

    } catch (error) {

        return [];

    }
}


/* =====================================================
   SAVE COMMENTS
===================================================== */

function saveComments(comments) {

    localStorage.setItem(
        getStorageKey("comments"),
        JSON.stringify(comments)
    );

}

/* =====================================================
   ADD COMMENT / REVIEW
===================================================== */

function addComment(event) {

    event.preventDefault();


    const nameInput =
        document.getElementById(
            "commentName"
        );


    const textInput =
        document.getElementById(
            "commentText"
        );


    const name =
        nameInput.value.trim();


    const text =
        textInput.value.trim();


    if (!name || !text) {

        return;

    }


    /*
       Remember the user's name
       for future reviews/replies.
    */

    localStorage.setItem(
        "wce_user_name",
        name
    );


    const comments =
        getComments();


    const newComment = {

        id:
            Date.now(),

        name:
            name,

        text:
            text,

        date:
            new Date().toLocaleString(),

        likes:
            0,

        liked:
            false,

        replies:
            []

    };


    comments.unshift(
        newComment
    );


    saveComments(
        comments
    );


    nameInput.value = "";

    textInput.value = "";


    loadComments();

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

function loadComments() {

    const list =
        document.getElementById(
            "commentsList"
        );


    if (!list) {
        return;
    }


    const comments =
        getComments();


    if (comments.length === 0) {

        list.innerHTML = `

            <p style="color:#777;">

                No reviews yet.
                Be the first to share
                your experience! 💬

            </p>

        `;

        return;
    }


    list.innerHTML =
        comments
            .map(
                comment =>
                    createCommentHTML(
                        comment
                    )
            )
            .join("");

}


/* =====================================================
   COMMENT HTML
===================================================== */

function createCommentHTML(
    comment
) {

    const replies =
        Array.isArray(
            comment.replies
        )
            ? comment.replies
            : [];


    const repliesHTML =
        replies
            .map(
                reply => `

                    <div class="reply-box">

                        <strong>
                            ${escapeHTML(
                                reply.name
                            )}
                        </strong>

                        <span class="comment-date">
                            ${escapeHTML(
                                reply.date
                            )}
                        </span>


                        <p class="comment-text">
                            ${escapeHTML(
                                reply.text
                            )}
                        </p>

                    </div>

                `
            )
            .join("");


    return `

        <div class="comment">

            <div class="comment-header">

                <span class="comment-user">
                    👤 ${escapeHTML(
                        comment.name
                    )}
                </span>


                <span class="comment-date">
                    ${escapeHTML(
                        comment.date
                    )}
                </span>

            </div>


            <p class="comment-text">
                ${escapeHTML(
                    comment.text
                )}
            </p>


            <div class="comment-actions">

                <button
                    class="comment-action"
                    onclick="
                        likeComment(
                            ${comment.id}
                        )
                    "
                >

                    ${
                        comment.liked
                            ? "❤️"
                            : "🤍"
                    }

                    Like (
                    ${comment.likes || 0}
                    )

                </button>


                <button
                    class="comment-action"
                    onclick="
                        showReplyForm(
                            ${comment.id}
                        )
                    "
                >
                    ↩️ Reply
                </button>

            </div>


            <div
                id="replyForm-${comment.id}"
                class="reply-form"
            >

                <textarea
                    id="replyText-${comment.id}"
                    placeholder="Write a reply..."
                    maxlength="300"
                ></textarea>


                <button
                    class="reply-submit"
                    onclick="
                        addReply(
                            ${comment.id}
                        )
                    "
                >
                    Post Reply
                </button>

            </div>


            ${repliesHTML}

        </div>

    `;

}


/* =====================================================
   LIKE COMMENT
===================================================== */

function likeComment(commentId) {

    const comments =
        getComments();


    const comment =
        comments.find(
            item =>
                item.id === commentId
        );


    if (!comment) {
        return;
    }


    if (comment.liked) {

        comment.likes =
            Math.max(
                0,
                (comment.likes || 0) - 1
            );


        comment.liked =
            false;

    } else {

        comment.likes =
            (comment.likes || 0) + 1;


        comment.liked =
            true;

    }


    saveComments(
        comments
    );


    loadComments();

}


/* =====================================================
   SHOW REPLY FORM
===================================================== */

function showReplyForm(commentId) {

    const form =
        document.getElementById(
            `replyForm-${commentId}`
        );


    if (!form) {
        return;
    }


    if (
        form.style.display ===
        "block"
    ) {

        form.style.display =
            "none";

    } else {

        form.style.display =
            "block";

    }

}


/* =====================================================
   ADD REPLY
===================================================== */

function addReply(commentId) {

    const textElement =
        document.getElementById(
            `replyText-${commentId}`
        );


    if (!textElement) {
        return;
    }


    const text =
        textElement.value.trim();


    if (!text) {
        return;
    }


    const name =
        localStorage.getItem(
            "wce_user_name"
        ) || "Guest";


    const comments =
        getComments();


    const comment =
        comments.find(
            item =>
                item.id === commentId
        );


    if (!comment) {
        return;
    }


    if (
        !Array.isArray(
            comment.replies
        )
    ) {

        comment.replies = [];

    }


    comment.replies.push({

        id:
            Date.now(),

        name:
            name,

        text:
            text,

        date:
            new Date().toLocaleString()

    });


    saveComments(
        comments
    );


    loadComments();

}


/* =====================================================
   LOAD SAVED USER NAME
===================================================== */

function loadSavedName() {

    const nameInput =
        document.getElementById(
            "commentName"
        );


    if (!nameInput) {
        return;
    }


    const savedName =
        localStorage.getItem(
            "wce_user_name"
        );


    if (savedName) {

        nameInput.value =
            savedName;

    }


    nameInput.addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "wce_user_name",
                nameInput.value.trim()
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}
